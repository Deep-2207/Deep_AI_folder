<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pattern Scanner</title>
<style>
  :root { --bg: #0e1116; --panel: #161b22; --line: #262d38; --text: #e6edf3; --muted: #8b95a3; --up: #26a69a; --down: #ef5350; --accent: #4c8dff; --warn: #f0b429; }
  * { box-sizing: border-box; }
  body { margin: 0; width: 370px; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, Segoe UI, sans-serif; }
  header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  header img { width: 20px; height: 20px; }
  header b { flex: 1; font-size: 14px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .dot.on { background: var(--up); } .dot.off { background: var(--down); }
  .row { display: flex; gap: 6px; padding: 10px 12px 0; }
  select, input, button { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px 7px; font: inherit; }
  input { width: 100%; text-transform: uppercase; min-width: 0; }
  select { flex: none; }
  button { cursor: pointer; }
  .banner { margin: 10px 12px 0; border-radius: 9px; padding: 10px 12px; border: 1px solid; }
  .banner .head { font-size: 20px; font-weight: 800; line-height: 1.15; }
  .banner .line { margin-top: 4px; }
  .banner.call { background: rgba(38,166,154,.14); border-color: var(--up); } .banner.call .head { color: var(--up); }
  .banner.put { background: rgba(239,83,80,.14); border-color: var(--down); } .banner.put .head { color: var(--down); }
  .banner.wait { background: rgba(240,180,41,.08); border-color: var(--warn); } .banner.wait .head { color: var(--warn); }
  .banner.closed { background: rgba(139,149,163,.08); border-color: var(--muted); } .banner.closed .head { color: var(--muted); }
  .levels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin: 8px 12px 0; }
  .levels div { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 6px; }
  .levels small { display: block; color: var(--muted); font-size: 10px; }
  .votes { display: grid; grid-template-columns: 62px auto 1fr; gap: 6px; align-items: start; margin: 8px 12px 0; font-size: 12px; }
  .chip { font-weight: 700; font-size: 11px; padding: 1px 6px; border-radius: 5px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .chip.UP, .chip.BULLISH, .chip.CALL { color: var(--up); border-color: var(--up); }
  .chip.DOWN, .chip.BEARISH, .chip.PUT { color: var(--down); border-color: var(--down); }
  .muted { color: var(--muted); } .small { font-size: 11px; }
  .UP { color: var(--up); } .DOWN { color: var(--down); }
  .note { margin: 8px 12px 0; }
  .err { color: var(--down); margin: 10px 12px 0; }
  .refresh { width: calc(100% - 24px); margin: 10px 12px 0; background: linear-gradient(90deg, var(--up), var(--accent)); border: 0; font-weight: 700; padding: 7px; color: #fff; }
  .links { display: flex; gap: 6px; padding: 10px 12px; }
  .links button { flex: 1; font-size: 12px; }
  label.chk { display: flex; gap: 6px; align-items: center; padding: 10px 12px 0; color: var(--muted); }
  label.chk input { width: auto; accent-color: var(--accent); }
  footer { padding: 0 12px 10px; color: var(--muted); font-size: 10px; }
</style>
</head>
<body>
<header>
  <img src="icons/icon32.png" alt="">
  <b>Pattern Scanner</b>
  <span class="dot" id="dot" title="Server status"></span>
</header>

<div class="row">
  <select id="provider" title="Market">
    <option value="yahoo">US stocks</option>
    <option value="nse">NSE stocks</option>
    <option value="binance">Crypto</option>
    <option value="nse_replay">NSE replay</option>
    <option value="seeder">Seeder</option>
  </select>
  <input id="symbol" aria-label="Symbol">
</div>
<div class="row">
  <select id="interval" title="Timeframe">
    <option>1m</option><option>5m</option><option>15m</option><option>30m</option><option>1h</option>
  </select>
  <select id="horizon" title="Look-ahead" style="flex:1">
    <option value="3">look-ahead 3 candles</option><option value="5">look-ahead 5 candles</option>
    <option value="10">look-ahead 10 candles</option><option value="20">look-ahead 20 candles</option>
  </select>
</div>

<div id="main"><div class="note muted">Loading the trade signal...</div></div>
<button class="refresh" id="refresh">&#8635; Refresh now</button>

<label class="chk"><input type="checkbox" id="alerts"> Desktop alert when a CALL/PUT trade starts or ends (checked every minute)</label>

<div class="links">
  <button data-open="/">Live page</button>
  <button data-open="/test">Test Lab</button>
  <button data-open="/backtest">Backtest</button>
</div>
<footer>Uses your local server at 127.0.0.1:5000. For learning and testing; not financial advice.</footer>

<script src="common.js"></script>
<script src="popup.js"></script>
</body>
</html>
